name: Continuous Integration - BridgeSQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  tests-and-quality:
    name: PHP ${{ matrix.php-version }} Tests & Quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_sqlite
          coverage: none
          tools: composer

      - name: 3. Check PHP Syntax (Lint)
        run: find src/ -type f -name "*.php" -exec php -l {} \;

      - name: 4. Install dependencies with Composer
        run: composer install --prefer-dist --no-progress --ignore-platform-reqs

      - name: 5. Verify Code Style (PHP-CS-Fixer)
        # Exécuté uniquement sur la version PHP 8.4 pour centraliser l'analyse de style
        if: matrix.php-version == '8.4'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: 6. Run Unit Tests (PHPUnit)
        run: vendor/bin/phpunit